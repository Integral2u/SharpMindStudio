<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pair with SharpMind Studio</title>
<style>
:root{color-scheme:dark;--bg:#0b1016;--panel:#121a24;--line:#2c3a4c;--text:#e6edf3;--muted:#8fa3b8;--accent:#5eead4;--bad:#f87171}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 0%,#13202b,#0b1016 55%);color:var(--text);font:15px/1.5 system-ui,Segoe UI,sans-serif;padding:1rem}
.card{width:min(28rem,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:1.3rem;box-shadow:0 18px 50px #0008}
h1{font-size:1.35rem;margin:0 0 .4rem}.eyebrow{color:var(--accent);font:600 .65rem ui-monospace,Consolas,monospace;letter-spacing:.16em;text-transform:uppercase}
p{color:var(--muted);margin:.2rem 0 1rem}.field{display:grid;gap:.35rem;margin:.75rem 0}label{font:600 .68rem ui-monospace,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
input,select,button{font:inherit}input,select{width:100%;padding:.7rem .8rem;border-radius:9px;border:1px solid var(--line);background:#0a1118;color:var(--text)}button{padding:.7rem 1rem;border-radius:9px;border:1px solid #2a6f66;background:var(--accent);color:#06201c;font-weight:700;cursor:pointer}button.secondary{background:transparent;color:var(--muted);border-color:var(--line)}
.status{margin-top:1rem;padding:.8rem;border-radius:9px;border:1px solid var(--line);color:var(--muted)}.status.ok{border-color:#2a6f66;color:var(--accent)}.status.bad{border-color:#7f1d1d;color:var(--bad)}
.hidden{display:none}.pin{font:700 1.6rem ui-monospace,Consolas,monospace;letter-spacing:.35em;color:var(--accent)}
</style>
</head>
<body>
<main class="card">
<div class="eyebrow">SharpMind Studio</div>
<h1>Pair this device</h1>
<p id="intro">Enter the PIN shown on the host PC.</p>
<form id="form">
<div class="field"><label for="name">Device name</label><input id="name" placeholder="Phone" autocomplete="off"></div>
<div class="field"><label for="pin">PIN</label><input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="000000"></div>
<button type="submit">Pair</button>
</form>
<div id="status" class="status">Reading pairing code…</div>
</main>
<script>
const token = new URLSearchParams(location.search).get('t') || '';
let polling = null;
const form = document.getElementById('form');
const statusBox = document.getElementById('status');
const intro = document.getElementById('intro');
function show(text, kind){ statusBox.textContent = text; statusBox.className = 'status' + (kind ? ' ' + kind : ''); }
async function poll(){
  if(!token) return;
  try {
    const res = await fetch('/pair/status?token=' + encodeURIComponent(token), {cache:'no-store'});
    if(!res.ok){ show('This pairing code is no longer valid. Scan a new QR code.', 'bad'); return; }
    const data = await res.json();
    if(data.status === 'awaiting_approval') show('Waiting for the host to approve this device…');
    else if(data.status === 'approved'){ show('Approved. Opening Studio…', 'ok'); clearInterval(polling); location.href = data.approvedMode === 'mobile' ? '/chat' : '/'; }
    else if(data.status === 'denied'){ show('The host denied this device.', 'bad'); clearInterval(polling); }
    else if(data.status === 'expired'){ show('This pairing code expired. Scan a new QR code.', 'bad'); clearInterval(polling); }
    else show('Enter the PIN to continue.');
  } catch { show('The host is unreachable. Check the address and try again.', 'bad'); }
}
form.addEventListener('submit', async e => {
  e.preventDefault();
  const pin = document.getElementById('pin').value.trim();
  const name = document.getElementById('name').value.trim() || 'Phone';
  if(!/^\d{6}$/.test(pin)){ show('Enter the 6-digit PIN.', 'bad'); return; }
  try {
    const res = await fetch('/pair/submit', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,pin,name})});
    if(!res.ok){ show('This pairing code is no longer valid.', 'bad'); return; }
    const data = await res.json();
    if(data.status === 'awaiting_approval'){ form.classList.add('hidden'); intro.classList.add('hidden'); show('Waiting for the host to approve this device…'); clearInterval(polling); polling=setInterval(poll,2000); }
    else if(data.status === 'approved'){ location.href = data.approvedMode === 'mobile' ? '/chat' : '/'; }
    else if(data.status === 'denied'){ show('Too many attempts or the host denied this device.', 'bad'); }
    else show('Check the PIN and try again.', 'bad');
  } catch { show('Could not reach the host.', 'bad'); }
});
if(!token){ show('Open this page from the host QR code.', 'bad'); form.classList.add('hidden'); }
else { polling=setInterval(poll,2000); poll(); }
</script>
</body>
</html>
