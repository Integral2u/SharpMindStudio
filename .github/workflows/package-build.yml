name: package-build

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The next version is not on NuGet yet. Pack the engine into the sibling
      # folder the NuGet config reads, then build the package-only solution.
      - name: Checkout the SharpMind engine
        uses: actions/checkout@v4
        with:
          repository: Integral2u/SharpMind
          path: SharpMindEngine
          ref: master

      - name: Create the local package feed
        shell: pwsh
        run: New-Item -ItemType Directory -Force ../SharpMind/nupkg | Out-Null

      - name: Pack the next SharpMind packages
        shell: pwsh
        run: |
          $projects = @(
            'SharpMindEngine/SharpMind.Core/SharpMind.Core.csproj',
            'SharpMindEngine/SharpMind.Data/SharpMind.Data.csproj',
            'SharpMindEngine/SharpMind.Tokenization/SharpMind.Tokenization.csproj',
            'SharpMindEngine/SharpMind.Model/SharpMind.Model.csproj',
            'SharpMindEngine/SharpMind.Inference/SharpMind.Inference.csproj',
            'SharpMindEngine/SharpMind.Training/SharpMind.Training.csproj'
          )
          foreach ($project in $projects) {
            dotnet pack $project -c Release -o ../SharpMind/nupkg -p:Version=1.1.1
          }

      - name: Build against the next packages
        run: dotnet build SharpMind.Studio.Package.slnx -c Release -p:SharpMindSource=package
