name: package-build

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Published SharpMind 1.1.1 packages from nuget.org. The source solution
      # remains the development target and uses the sibling engine projects.
      - name: Build against published packages
        run: dotnet build SharpMind.Studio.Package.slnx -c Release -p:SharpMindSource=package
