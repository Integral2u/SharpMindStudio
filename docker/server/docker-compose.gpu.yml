services:
  server:
    build:
      context: ../../..
      dockerfile: SharpMind.Studio/docker/server/Dockerfile.gpu.local
    ports:
      - "5117:5117"
      - "5118:5118"
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      SHARPMIND_TOKEN: ${SHARPMIND_TOKEN:?Set SHARPMIND_TOKEN}
      Studio__Root: /data/SharpMind
      Studio__Url: http://0.0.0.0:5117
      Studio__LanUrl: http://0.0.0.0:5118
      Studio__LanEnabled: "true"
      SHARPMIND_DATA: /data/SharpMind
      SHARPMIND_MODELS_DIR: /data/SharpMind/Models
      SHARPMIND_PLUGINS: /app/plugins
      SHARPMIND_ACCELERATOR: auto
      SHARPMIND_INFERENCE_ACCELERATOR: auto
    volumes:
      - ${SHARPMIND_DATA:-./server-data}:/data/SharpMind
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
