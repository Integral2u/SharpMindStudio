services:
  server:
    build:
      # Parent folder containing both SharpMind/ and SharpMind.Studio/.
      context: ../../..
      dockerfile: SharpMind.Studio/docker/server/Dockerfile.local
    ports:
      - "5117:5117"
      - "5118:5118"
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      SHARPMIND_TOKEN: ${SHARPMIND_TOKEN:?Set SHARPMIND_TOKEN}
      Studio__Root: /data/SharpMind
      Studio__Url: http://0.0.0.0:5117
      Studio__LanUrl: http://0.0.0.0:5118
      Studio__LanEnabled: "true"
      SHARPMIND_DATA: /data/SharpMind
      SHARPMIND_MODELS_DIR: /data/SharpMind/Models
      SHARPMIND_PLUGINS: /app/plugins
    volumes:
      - ${SHARPMIND_DATA:-./server-data}:/data/SharpMind
    restart: unless-stopped
